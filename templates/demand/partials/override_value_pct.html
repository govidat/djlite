{% load i18n %}
<div class="form-control" id="override-value-input">
    <label class="label">
        <span class="label-text">{% trans "Adjustment %" %}</span>
        <span class="label-text-alt text-base-content/50">
            {% trans "Positive to increase, negative to decrease (e.g. 10 or -5)" %}
        </span>
    </label>
    <div class="join">
        <input type="number" step="0.001" name="override_pct"
               class="input input-bordered join-item"
               placeholder="{% trans 'e.g. 10 or -5' %}"
               value="{{ form_data.override_pct|default:'' }}">
        <span class="join-item btn btn-disabled">%</span>
    </div>
</div>
