{% load i18n %}
{% for sub in substitutions %}
<tr id="sub-row-{{ sub.pk }}">
  <td>{{ sub.old_item_id }}</td>
  <td>{{ sub.new_item_id }}</td>
  <td>{{ sub.conversion_factor }}</td>
  <td>{{ sub.effective_from|default:"—" }}</td>
  <td>{{ sub.updated_at|date:"d M Y" }}</td>
  <td class="whitespace-nowrap">
    <button class="btn btn-ghost btn-xs"
            hx-get="{% url 'demand_ui:item_substitution_edit' client_code=client.client_code pk=sub.pk %}"
            hx-target="#modal-content"
            hx-swap="innerHTML"
            onclick="document.getElementById('lifecycle-modal').showModal()">
      {% trans "Edit" %}
    </button>
    <form class="inline"
          hx-post="{% url 'demand_ui:item_substitution_delete' client_code=client.client_code pk=sub.pk %}"
          hx-target="#sub-row-{{ sub.pk }}"
          hx-swap="outerHTML"
          hx-confirm="{% trans 'Delete this substitution?' %}">
      {% csrf_token %}
      <button type="submit" class="btn btn-error btn-xs">{% trans "Delete" %}</button>
    </form>
  </td>
</tr>
{% empty %}
<tr><td colspan="6" class="text-base-content/60">{% trans "No substitutions configured." %}</td></tr>
{% endfor %}
