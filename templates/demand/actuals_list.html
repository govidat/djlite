{% extends "demand/_base_demand.html" %}
{% load i18n %}

{% block demand_content %}
<div class="flex items-center justify-between mb-6">
    <h2 class="text-xl font-bold">{% trans "Actual Sales" %}</h2>
    <div class="flex gap-2">
        <a href="{% url 'demand_ui:actuals_aggregates' client_id=client.client_id %}"
           class="btn btn-ghost btn-sm">Σ {% trans "View Summary" %}</a>
        <a href="{% url 'demand_ui:actuals_upload' client_id=client.client_id %}"
           class="btn btn-primary btn-sm">↑ {% trans "Upload Actuals" %}</a>
    </div>
</div>

<div id="actuals-table-container">
    {% include "demand/partials/actuals_filter_bar.html" %}
    {% include "demand/partials/actuals_table_body.html" %}
</div>



{% endblock %}
